appId: com.sorawit.spring-initializr
productName: Spring-Initializr
copyright: Copyright © 2026 Sorawit thassadorn

directories:
  output: dist
  buildResources: resources

files:
  - "app/**/*"
  - "main/**/*"
  - "renderer/**/*"
  - "node_modules/**/*"
  - "package.json"

win:
  target: nsis

mac:
  target: dmg

linux:
  target:
    - AppImage
    - pacman
  category: Development

publish: null
